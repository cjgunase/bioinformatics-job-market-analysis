taxonomy_version: 1.0.0
spec_version: 1.1.1
status: implementation_baseline
human_review_status: pending_initial_review
canonical_findings_eligible: false
coding_rule: Code the most specific explicitly supported skill and roll up through parent_skill_id.
context_rule: Bioinformatics context nodes are reported separately and do not count as software-engineering competencies by themselves.
ai_rule: Generic automation, algorithms, statistical modeling, and conventional bioinformatics are not AI evidence.

categories:
  - category_id: programming_software_construction
    preferred_label: Programming and software construction
    definition: Languages and practices used to construct and improve software.
  - category_id: version_control_collaboration
    preferred_label: Version control and collaboration
    definition: Source-control tools and collaborative software-development practices.
  - category_id: testing_quality_reliability
    preferred_label: Testing, quality, and reliability
    definition: Practices that test, observe, validate, and operate reliable software.
  - category_id: build_release_devops
    preferred_label: Build, release, and DevOps
    definition: Build, dependency, deployment, release, and artifact-management practices.
  - category_id: containers_orchestration_cloud
    preferred_label: Containers, orchestration, and cloud
    definition: Container, orchestration, and cloud platforms and practices.
  - category_id: workflow_scientific_computing
    preferred_label: Workflow and scientific computing
    definition: Scientific workflow systems and computational execution practices.
  - category_id: data_engineering_platforms
    preferred_label: Data engineering and platforms
    definition: Data storage, movement, modeling, quality, search, and governance.
  - category_id: architecture_product_engineering
    preferred_label: Architecture and product engineering
    definition: System architecture, service, platform, and user-facing engineering.
  - category_id: security_privacy_regulated_engineering
    preferred_label: Security, privacy, and regulated engineering
    definition: Technical security, privacy, compliance, and regulated lifecycle controls.
  - category_id: documentation_engineering_process
    preferred_label: Documentation and engineering process
    definition: Documentation, delivery process, communication, and technical leadership.
  - category_id: bioinformatics_engineering_context
    preferred_label: Bioinformatics engineering context
    definition: Biological domains and scientific-computing contexts reported separately from engineering prevalence.
  - category_id: ai_engineering
    preferred_label: AI-related engineering
    definition: Explicit AI-assisted development, ML, generative AI, agents, evaluation, and scientific AI.
  - category_id: durable_ai_era_engineering
    preferred_label: Durable AI-era engineering competencies
    definition: Competencies for directing, understanding, verifying, governing, and maintaining agent-produced systems.

