null_policy:
  format: null
  description: Use YAML/JSON null for unavailable or not-yet-established values.
  prohibitions:
    - Do not use empty strings as missing values.
    - Do not impute absent salary or evidence fields.

governance:
  - Controlled values are exact snake_case identifiers.
  - Additions or semantic changes require a reviewed decision-log entry.
  - Taxonomy skill and category identifiers are defined by taxonomy/taxonomy.yaml version 1.0.0.
